# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY.
#
# This is not the production topology. Production (F19/F20) adds the four
# isolated Docker networks required by PRD Nº4 §67, drops all published ports,
# and runs the app itself as a container.
#
# Here every port is bound to 127.0.0.1 on purpose: PRD Nº4 §110 forbids
# exposing 5432 / 7700 / 9000 / 9001 to the internet, and a plain `5432:5432`
# on a laptop with a public interface is exactly that mistake at small scale.
#
# Host ports use a project-specific 5xxxx block rather than the service
# defaults. Developer machines routinely already run a Postgres on 5432 and
# something on 9000; claiming the defaults makes this stack fight whatever else
# the machine is hosting. Container-internal ports stay standard.
# ─────────────────────────────────────────────────────────────────────────────

name: clasificados-dev

services:
  postgres:
    # Pinned tag, never `latest` (PRD Nº4 §106).
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      # DEV ONLY: this role owns the dev database.
      # Production must use a limited, non-superuser application role
      # (`clasificados_app`) scoped to its own database — PRD Nº4 §14.
      POSTGRES_USER: clasificados_app
      POSTGRES_PASSWORD: clasificados_dev
      POSTGRES_DB: clasificados_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - clasificados_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clasificados_app -d clasificados_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    # Wired in F14. Present now so the dev stack matches production shape.
    image: getmeili/meilisearch:v1.24
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      # Even in development Meilisearch runs with a master key.
      # PRD Nº4 §34: never operate Meilisearch in production unprotected, and
      # developing without a key trains the wrong habit.
      MEILI_MASTER_KEY: clasificados_dev_master_key_change_me
    ports:
      - '127.0.0.1:57700:7700'
    volumes:
      - clasificados_meili_data:/meili_data
    healthcheck:
      test: ['CMD', 'meilisearch', '--help']
      interval: 15s
      timeout: 5s
      retries: 3

  minio:
    # Evidence Vault. Wired in F6.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clasificados_dev_minio
      MINIO_ROOT_PASSWORD: clasificados_dev_minio_secret
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      - clasificados_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

# Explicit named volumes, never anonymous (PRD Nº4 §76).
volumes:
  clasificados_postgres_data:
    name: clasificados_postgres_data
  clasificados_meili_data:
    name: clasificados_meili_data
  clasificados_minio_data:
    name: clasificados_minio_data
